<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@500;700&amp;family=Luckiest+Guy&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f16;font-family:'Barlow',sans-serif;color:#e9eef6}
.float{animation:float 3.2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-10px)}}
@media (prefers-reduced-motion:reduce){.float{animation:none}}
.outlined{text-shadow:4px 0 0 #0b0e13,-4px 0 0 #0b0e13,0 4px 0 #0b0e13,0 -4px 0 #0b0e13,3px 3px 0 #0b0e13,-3px 3px 0 #0b0e13,3px -3px 0 #0b0e13,-3px -3px 0 #0b0e13,0 7px 0 #0b0e13}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; background: #0b0f16; color: #e9eef6; font-family: 'Barlow', sans-serif">
  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 36px">
    <svg class="float" viewBox="0 0 100 124" role="img" aria-label="PLAYER 4, pink ghost" style="width: 150px; height: 186px; display: block; flex: none; overflow: visible; opacity: 0.6">
      <path d="M6 44 Q6 38 12 38 L24 38 L24 90 L12 90 Q6 90 6 84 Z" fill="#EE54BB" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 104 Q84 118 76 106 Q68 94 60 106 Q52 118 44 106 Q36 94 28 106 L24 110 Z" fill="#EE54BB"></path>
      <path d="M24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 104 Q84 118 76 106 Q68 94 60 106 Q52 118 44 106 Q36 94 28 106 L24 110 Z" fill="none" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
      <rect x="50" y="24" width="48" height="28" rx="14" fill="#95CADC" stroke="#0b0e13" stroke-width="6"></rect>
      <rect x="70" y="29" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.85"></rect>
    </svg>
    <h1 class="outlined" style="margin: 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 42px; line-height: 1.1; letter-spacing: 2px; color: #ffffff; text-align: center">YOU ARE DEAD</h1>
    <div style="display: flex; align-items: center; gap: 10px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 24px; line-height: 1; letter-spacing: 1px; color: #e9eef6">PLAYER 4</span>
      <span style="display: inline-block; padding: 3px 12px 3px 14px; background: #0e2a33; border: 2px solid #8CFFFF; border-radius: 999px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; line-height: 1.2; letter-spacing: 2px; color: #8CFFFF">CREWMATE</span>
    </div>
  </div>
  <div style="margin-top: 26px; display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; background: #141a24; border: 3px solid #0b0e13; border-radius: 16px; font-family: 'Barlow', sans-serif; font-size: 17px; line-height: 1.4; color: #e9eef6">
    <p style="margin: 0; font-weight: 700">Stay down with your badge visible until your body is reported.</p>
    <p style="margin: 0; font-weight: 500">After that, stay quiet: ghosts can't vote, report or call meetings.</p>
  </div>
  <div style="margin-top: 14px; background: #141a24; border: 3px solid #0b0e13; border-radius: 16px; padding: 14px 16px 3px">
    <h2 style="margin: 0; padding-bottom: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; letter-spacing: 2px; color: #e9eef6">YOUR TASKS STILL COUNT</h2>
    <ul role="list" style="margin: 0; padding: 0; list-style: none">
      <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="2">
        <li style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-top: 2px solid #0b0e13">
          <div style="flex: none; width: 30px; height: 30px; margin-top: -3px">
            <sc-if value="{{ t.isDone }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 32 32" role="img" aria-label="Done" style="display: block; width: 30px; height: 30px">
                <circle cx="16" cy="16" r="12.5" fill="#43d15d" stroke="#0b0e13" stroke-width="3"></circle>
                <path d="M10.5 16.5 L14.5 20.5 L21.5 12.5" fill="none" stroke="#07210e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </sc-if>
            <sc-if value="{{ t.isDoing }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 32 32" role="img" aria-label="In progress" style="display: block; width: 30px; height: 30px">
                <circle cx="16" cy="16" r="12" fill="none" stroke="#ffd400" stroke-width="4"></circle>
                <path d="M16 9 A7 7 0 0 1 16 23 Z" fill="#ffd400"></path>
              </svg>
            </sc-if>
            <sc-if value="{{ t.isTodo }}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 32 32" role="img" aria-label="To do" style="display: block; width: 30px; height: 30px">
                <circle cx="16" cy="16" r="12.5" fill="none" stroke="#6b7a90" stroke-width="3"></circle>
              </svg>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <div style="font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; color: #e9eef6; text-wrap: balance"><span>{{ t.name }}</span> <sc-if value="{{ t.hasStep }}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; vertical-align: middle; padding: 1px 7px 1px 8px; background: #2b2709; border: 2px solid #ffd400; border-radius: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; line-height: 1.15; letter-spacing: 1.5px; color: #ffd400; white-space: nowrap">{{ t.step }}</span></sc-if></div>
            <div style="align-self: flex-start; padding: 2px 7px; background: #10151f; border: 2px solid #0b0e13; border-radius: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; line-height: 1.2; letter-spacing: 2px; color: #c9d3e1">{{ t.room }}</div>
          </div>
        </li>
      </sc-for>
    </ul>
  </div>
  <div style="margin-top: auto; text-align: center; font-family: 'VT323', monospace; font-size: 20px; line-height: 1; color: #a9b4c3">{{ server }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const tasks = [
      { name: 'Download Data, then Upload Data', room: 'CAFETERIA, THEN ADMIN', state: 'doing', step: 'STEP 2 OF 2' },
      { name: 'Start Reactor', room: 'REACTOR', state: 'todo', step: '' }
    ].map((t) => ({
      name: t.name,
      room: t.room,
      step: t.step,
      hasStep: t.step !== '',
      isDone: t.state === 'done',
      isDoing: t.state === 'doing',
      isTodo: t.state === 'todo'
    }));
    return { tasks: tasks, server: '192.168.11.220:8740' };
  }
}
</script>
</body>
</html>
