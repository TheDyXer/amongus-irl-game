<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emergency button station</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@500;700&amp;family=Luckiest+Guy&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05060d;font-family:'Barlow',sans-serif;color:#e9eef6}
.outlined{text-shadow:4px 0 0 #0b0e13,-4px 0 0 #0b0e13,0 4px 0 #0b0e13,0 -4px 0 #0b0e13,3px 3px 0 #0b0e13,-3px 3px 0 #0b0e13,3px -3px 0 #0b0e13,-3px -3px 0 #0b0e13,0 7px 0 #0b0e13}
.dome{transform-origin:50% 82%;transition:transform .15s ease-out}
.dome:hover:not(:disabled){transform:scale(1.03)}
.dome:active:not(:disabled){transform:scale(.97)}
.dome:focus-visible{outline:4px solid #8CFFFF;outline-offset:6px;border-radius:28px}
.cap{transform-box:fill-box;transform-origin:50% 100%;transition:transform .1s ease-out}
.dome:active:not(:disabled) .cap{transform:scaleY(.78)}
.chunky{transition:transform .12s ease-out}
.chunky:hover:not(:disabled){transform:translateY(-2px)}
.chunky:active:not(:disabled){transform:translateY(1px)}
.chunky:focus-visible{outline:4px solid #8CFFFF;outline-offset:3px}
.fade-in{animation:fadein .2s ease-out both}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.pop-in{animation:popin .26s cubic-bezier(.2,1.4,.4,1) both}
@keyframes popin{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.band{transform-origin:50% 50%;animation:band .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes band{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pop{animation:pop .5s ease-out .15s both}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.flash{animation:flash 1s steps(1) infinite}
@keyframes flash{0%{opacity:1}50%{opacity:0}}
.lamp{background:#ff3b30;animation:lamp 1s steps(1) infinite}
@keyframes lamp{0%{background:#ff3b30}50%{background:#4a1414}}
@media (prefers-reduced-motion:reduce){.fade-in,.pop-in,.band,.pop,.flash,.lamp{animation:none}.dome,.cap,.chunky{transition:none}}
</style>
</helmet>
<div style="width: 1024px; height: 832px; position: relative; overflow: hidden; background: #05060d; font-family: 'Barlow', sans-serif; color: #e9eef6">
  <div style="position: absolute; left: 0; top: 0; width: 1024px; height: 768px; overflow: hidden; background: #2c3440">
    <div style="position: absolute; left: 0; top: 512px; width: 1024px; height: 256px; background: #4b5663"></div>
    <svg viewBox="0 0 1024 256" aria-hidden="true" style="position: absolute; left: 0; top: 512px; width: 1024px; height: 256px">
      <path d="M0 64 H1024 M0 150 H1024 M180 0 L-22 256 M380 0 L300 256 M644 0 L724 256 M844 0 L1046 256" stroke="#414b57" stroke-width="4" fill="none"></path>
    </svg>
    <div style="position: absolute; left: 0; top: 504px; width: 1024px; height: 14px; background: #1c232c"></div>
    <h1 style="position: absolute; left: 40px; top: 36px; margin: 0; padding: 8px 16px 8px 22px; background: #141a24; border: 4px solid #0b0e13; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 40px; line-height: 1.2; letter-spacing: 6px; color: #e9eef6">EMERGENCY BUTTON</h1>
    <div role="status" style="position: absolute; right: 40px; top: 46px; height: 52px; box-sizing: border-box; padding: 0 15px 0 14px; display: flex; align-items: center; gap: 12px; background: #141a24; border: 4px solid #0b0e13; border-radius: 12px">
      <sc-if value="{{ alarmOn }}" hint-placeholder-val="{{ false }}">
        <span class="lamp" style="display: block; flex: none; width: 22px; height: 22px; box-sizing: border-box; border: 3px solid #0b0e13; border-radius: 50%"></span>
      </sc-if>
      <sc-if value="{{ alarmOff }}" hint-placeholder-val="{{ true }}">
        <span style="display: block; flex: none; width: 22px; height: 22px; box-sizing: border-box; border: 3px solid #0b0e13; border-radius: 50%; background: #43d15d"></span>
      </sc-if>
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1; letter-spacing: 3px; color: {{statusInk}}">{{ statusText }}</span>
    </div>
    <svg viewBox="0 0 720 420" aria-hidden="true" style="position: absolute; left: 152px; top: 232px; width: 720px; height: 420px">
      <ellipse cx="360" cy="348" rx="290" ry="48" fill="#414b57"></ellipse>
      <path d="M252 336 L252 348 A108 26 0 0 0 468 348 L468 336 Z" fill="#2f3845" stroke="#0b0e13" stroke-width="8" stroke-linejoin="round"></path>
      <ellipse cx="360" cy="336" rx="108" ry="26" fill="#3a4454" stroke="#0b0e13" stroke-width="8"></ellipse>
      <path d="M320 180 L320 336 A40 10 0 0 0 400 336 L400 180 Z" fill="#3a4454" stroke="#0b0e13" stroke-width="8" stroke-linejoin="round"></path>
      <rect x="334" y="190" width="12" height="148" fill="#46515f"></rect>
      <path d="M30 136 L30 162 A330 92 0 0 0 690 162 L690 136 Z" fill="#3f4853" stroke="#0b0e13" stroke-width="8" stroke-linejoin="round"></path>
      <ellipse cx="360" cy="136" rx="330" ry="92" fill="#56616d" stroke="#0b0e13" stroke-width="8"></ellipse>
      <ellipse cx="360" cy="136" rx="296" ry="80" fill="none" stroke="#63707d" stroke-width="5"></ellipse>
    </svg>
    <button type="button" class="dome" onClick="{{ press }}" disabled="{{ domeOff }}" aria-label="Press the emergency button" style="position: absolute; left: 332px; top: 122px; width: 360px; height: 300px; margin: 0; padding: 0; background: transparent; border: 0; cursor: {{domeCursor}}; filter: {{domeFilter}}">
      <svg viewBox="0 0 360 300" aria-hidden="true" style="display: block; width: 360px; height: 300px; overflow: visible">
        <path d="M4 224 L4 246 A176 49 0 0 0 356 246 L356 224 Z" fill="#3a4454" stroke="#0b0e13" stroke-width="8" stroke-linejoin="round"></path>
        <ellipse cx="180" cy="224" rx="176" ry="49" fill="#4e5a6c" stroke="#0b0e13" stroke-width="8"></ellipse>
        <circle cx="28" cy="224" r="4.5" fill="#8593a6" stroke="#0b0e13" stroke-width="2.5"></circle>
        <circle cx="48.4" cy="245.3" r="4.5" fill="#8593a6" stroke="#0b0e13" stroke-width="2.5"></circle>
        <circle cx="311.6" cy="245.3" r="4.5" fill="#8593a6" stroke="#0b0e13" stroke-width="2.5"></circle>
        <circle cx="332" cy="224" r="4.5" fill="#8593a6" stroke="#0b0e13" stroke-width="2.5"></circle>
        <path d="M52 224 A128 36 0 0 1 308 224" fill="none" stroke="#0b0e13" stroke-width="4"></path>
        <g class="cap">
          <path d="M104 168 L104 224 A76 21 0 0 0 256 224 L256 168 Z" fill="#b81818" stroke="#0b0e13" stroke-width="7" stroke-linejoin="round"></path>
          <ellipse cx="180" cy="168" rx="76" ry="21" fill="#ff4747" stroke="#0b0e13" stroke-width="7"></ellipse>
          <ellipse cx="156" cy="161" rx="28" ry="6" fill="#ff8a80"></ellipse>
        </g>
        <path d="M52 224 C52 141.2 109.3 74 180 74 C250.7 74 308 141.2 308 224 A128 36 0 0 1 52 224 Z" fill="#bfe6ff" fill-opacity="0.25" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
        <path d="M82.3 181.6 A104 124 0 0 1 136 111.6" fill="none" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.85"></path>
        <circle cx="158.4" cy="102.7" r="5.5" fill="#ffffff" opacity="0.85"></circle>
        <path d="M275 153 A112 134 0 0 1 288.7 191.6" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.45"></path>
      </svg>
    </button>
    <p style="position: absolute; left: 0; right: 0; bottom: 44px; margin: 0; text-align: center; font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 20px; line-height: 1.2; color: #d5dde8">One emergency meeting per player</p>
    <sc-if value="{{ showLocked }}" hint-placeholder-val="{{ false }}">
      <div class="fade-in" style="position: absolute; left: 0; top: 236px; width: 1024px; display: flex; justify-content: center; pointer-events: none">
        <div role="alert" style="padding: 14px 26px; background: #10151f; border: 4px solid #0b0e13; border-radius: 14px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1.15; letter-spacing: 1px; color: #ff3b30">
          <div class="flash">
            <div>EMERGENCY MEETINGS CANNOT</div>
            <div>BE CALLED DURING CRISES</div>
          </div>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ showWho }}" hint-placeholder-val="{{ false }}">
      <div class="fade-in" style="position: absolute; left: 0; top: 0; width: 1024px; height: 768px; background: rgba(5, 6, 13, 0.74)">
        <div class="pop-in" role="dialog" aria-label="Who's calling?" style="position: absolute; left: 132px; top: 154px; width: 760px; height: 460px; box-sizing: border-box; padding: 22px 28px 24px; display: flex; flex-direction: column; justify-content: center; gap: 22px; background: #10151f; border: 5px solid #0b0e13; border-radius: 20px">
          <div style="display: flex; flex-direction: column; align-items: center; gap: 14px">
            <h2 class="outlined" style="margin: 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 44px; line-height: 1.1; letter-spacing: 2px; color: #ffffff">WHO'S CALLING?</h2>
            <p style="margin: 0; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 18px; line-height: 1.3; color: #c9d3e1">{{ whoHint }}</p>
          </div>
          <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px">
            <sc-for list="{{ who }}" as="p" hint-placeholder-count="6">
              <button type="button" class="chunky" onClick="{{ p.pick }}" disabled="{{ p.off }}" style="min-height: 96px; box-sizing: border-box; display: flex; align-items: center; gap: 12px; margin: 0; padding: 10px 14px; background: #1a2130; border: 3px solid #0b0e13; border-radius: 14px; text-align: left; cursor: {{p.cursor}}; opacity: {{p.op}}">
                <svg viewBox="0 0 100 124" aria-hidden="true" style="flex: none; display: block; width: 48px; height: 59px; overflow: visible">
                  <path d="M6 44 Q6 38 12 38 L24 38 L24 90 L12 90 Q6 90 6 84 Z" fill="{{p.c}}" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
                  <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{p.c}}"></path>
                  <path d="M24 74 Q32 100 55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{p.s}}"></path>
                  <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="none" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
                  <rect x="50" y="24" width="48" height="28" rx="14" fill="#95CADC" stroke="#0b0e13" stroke-width="6"></rect>
                  <rect x="70" y="29" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.85"></rect>
                </svg>
                <span style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
                  <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 26px; line-height: 1.05; letter-spacing: 1px; color: #e9eef6">{{ p.name }}</span>
                  <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 15px; line-height: 1.2; letter-spacing: 2px; color: {{p.subInk}}">{{ p.sub }}</span>
                </span>
              </button>
            </sc-for>
          </div>
          <button type="button" class="chunky" onClick="{{ cancel }}" style="align-self: center; min-width: 220px; height: 52px; margin: 0; padding: 0 28px; background: #2b3445; border: 3px solid #0b0e13; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px; color: #e9eef6; cursor: pointer">CANCEL</button>
        </div>
      </div>
    </sc-if>
    <sc-if value="{{ showCalled }}" hint-placeholder-val="{{ false }}">
      <div class="fade-in" style="position: absolute; left: 0; top: 0; width: 1024px; height: 768px; background: rgba(5, 6, 13, 0.62)">
        <div class="band" style="position: absolute; left: 0; top: 194px; width: 1024px; height: 380px">
          <svg viewBox="0 0 1024 380" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 1024px; height: 380px">
            <path d="{{ jag }}" fill="#c01818"></path>
            <rect x="0" y="30" width="1024" height="320" fill="#141a24"></rect>
          </svg>
          <div role="alert" style="position: absolute; left: 0; top: 30px; width: 1024px; height: 320px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center">
            <svg class="pop" viewBox="0 0 100 124" aria-hidden="true" style="display: block; width: 80px; height: 99px; overflow: visible">
              <path d="M6 44 Q6 38 12 38 L24 38 L24 90 L12 90 Q6 90 6 84 Z" fill="{{caller.c}}" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
              <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{caller.c}}"></path>
              <path d="M24 74 Q32 100 55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{caller.s}}"></path>
              <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="none" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
              <rect x="50" y="24" width="48" height="28" rx="14" fill="#95CADC" stroke="#0b0e13" stroke-width="6"></rect>
              <rect x="70" y="29" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.85"></rect>
            </svg>
            <h2 class="outlined pop" style="margin: 14px 0 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 64px; line-height: 1.05; letter-spacing: 2px; color: #ff3b30; animation-delay: .25s">EMERGENCY MEETING!</h2>
            <p style="margin: 18px 0 0; font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 24px; line-height: 1.25; color: #e9eef6">{{ calledLine }}</p>
            <p style="margin: 6px 0 0; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 18px; line-height: 1.3; color: #c9d3e1">{{ usedLine }}</p>
          </div>
        </div>
      </div>
    </sc-if>
  </div>
  <div style="position: absolute; left: 0; top: 768px; width: 1024px; height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; background: #10151f; border-top: 3px solid #0b0e13; font-family: 'Barlow Condensed', sans-serif">
    <span style="font-weight: 800; font-size: 17px; letter-spacing: 2px; color: #a9b4c3; margin-right: 6px">PREVIEW CONTROLS</span>
    <sc-for list="{{ modeButtons }}" as="m" hint-placeholder-count="2">
      <button type="button" onClick="{{ m.pick }}" aria-pressed="{{ m.pressed }}" style="height: 44px; padding: 0 14px; border: 3px solid #0b0e13; border-radius: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 1px; text-transform: uppercase; background: {{m.bg}}; color: {{m.fg}}; cursor: pointer">{{ m.label }}</button>
    </sc-for>
    <button type="button" onClick="{{ reset }}" style="height: 44px; padding: 0 14px; margin-left: 8px; border: 3px solid #0b0e13; border-radius: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 1px; text-transform: uppercase; background: #2b3445; color: #e9eef6; cursor: pointer">Reset</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":832}}'>
class Component extends DCLogic {
  componentWillUnmount() {
    clearTimeout(this.backTimer);
  }
  crew() {
    return [
      { n: 1, name: 'PLAYER 1', c: '#C61111', s: '#7A0838', badge: '01', alive: true },
      { n: 2, name: 'PLAYER 2', c: '#132ED2', s: '#09158E', badge: '02', alive: true },
      { n: 3, name: 'PLAYER 3', c: '#50F039', s: '#15A842', badge: '07', alive: true },
      { n: 4, name: 'PLAYER 4', c: '#EE54BB', s: '#AC2BAE', badge: '04', alive: false },
      { n: 5, name: 'PLAYER 5', c: '#F07D0D', s: '#B43E15', badge: '05', alive: true },
      { n: 6, name: 'PLAYER 6', c: '#F6F657', s: '#C38822', badge: '06', alive: true },
      { n: 7, name: 'PLAYER 7', c: '#38FFDD', s: '#24A9BF', badge: '03', alive: true }
    ];
  }
  current() {
    const st = Object.assign({ mode: 'ready', caller: 0, used: [] }, this.state || {});
    return Object.assign({}, st, { used: Array.isArray(st.used) ? st.used : [] });
  }
  jagPath() {
    let d = 'M0 30';
    for (let x = 0; x < 1024; x += 32) d += ' L' + (x + 16) + ' 4 L' + (x + 32) + ' 30';
    d += ' L1024 350';
    for (let x = 1024; x > 0; x -= 32) d += ' L' + (x - 16) + ' 376 L' + (x - 32) + ' 350';
    return d + ' Z';
  }
  callMeeting(n) {
    const st = this.current();
    if (st.mode !== 'who' || st.used.indexOf(n) >= 0) return;
    this.setState({ mode: 'called', caller: n, used: st.used.concat([n]) });
    clearTimeout(this.backTimer);
    this.backTimer = setTimeout(() => {
      if (this.current().mode === 'called') this.setState({ mode: 'ready' });
    }, 4000);
  }
  renderVals() {
    const st = this.current();
    const locked = st.mode === 'locked';
    const alarm = locked || st.mode === 'called';
    const living = this.crew().filter((p) => p.alive);
    const who = living.map((p) => {
      const used = st.used.indexOf(p.n) >= 0;
      return {
        name: p.name,
        c: p.c,
        s: p.s,
        off: used,
        sub: used ? 'MEETING USED' : 'BADGE ' + p.badge,
        subInk: used ? '#ffb020' : '#a9b4c3',
        op: used ? '0.7' : '1',
        cursor: used ? 'not-allowed' : 'pointer',
        pick: () => this.callMeeting(p.n)
      };
    });
    const left = who.filter((p) => !p.off).length;
    const caller = living.filter((p) => p.n === st.caller)[0] || living[0];
    const tone = (on) => (on ? { bg: '#8CFFFF', fg: '#07131a', pressed: 'true' } : { bg: '#2b3445', fg: '#e9eef6', pressed: 'false' });
    const modeButtons = [
      {
        label: 'Normal',
        on: !locked,
        pick: () => {
          if (this.current().mode === 'locked') this.setState({ mode: 'ready' });
        }
      },
      {
        label: 'Comms sabotage',
        on: locked,
        pick: () => {
          clearTimeout(this.backTimer);
          this.setState({ mode: 'locked' });
        }
      }
    ].map((m) => Object.assign({ label: m.label, pick: m.pick }, tone(m.on)));
    return {
      press: () => {
        if (this.current().mode === 'ready') this.setState({ mode: 'who' });
      },
      domeOff: st.mode !== 'ready',
      domeCursor: st.mode === 'ready' ? 'pointer' : locked ? 'not-allowed' : 'default',
      domeFilter: locked ? 'brightness(0.5) saturate(0.35)' : 'none',
      alarmOn: alarm,
      alarmOff: !alarm,
      statusText: locked ? '[COMMS DISABLED]' : st.mode === 'called' ? 'MEETING CALLED' : 'READY',
      statusInk: alarm ? '#ff3b30' : '#e9eef6',
      showLocked: locked,
      showWho: st.mode === 'who',
      showCalled: st.mode === 'called',
      who: who,
      whoHint: left ? 'Tap your name to call the meeting.' : 'Everyone alive has used their emergency meeting.',
      cancel: () => {
        if (this.current().mode === 'who') this.setState({ mode: 'ready' });
      },
      caller: { c: caller.c, s: caller.s },
      calledLine: 'Called by ' + caller.name + '. Everyone to the meeting room!',
      usedLine: caller.name + ' has no emergency meetings left.',
      jag: this.jagPath(),
      modeButtons: modeButtons,
      reset: () => {
        clearTimeout(this.backTimer);
        this.setState({ mode: 'ready', caller: 0, used: [] });
      }
    };
  }
}
</script>
</body>
</html>
