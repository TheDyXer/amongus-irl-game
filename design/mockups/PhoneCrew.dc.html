<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Crewmate phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@500;700&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f16;font-family:'Barlow',sans-serif;color:#e9eef6}
.float{animation:float 3.2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-4px)}}
.fill-in{transform-origin:0 50%;animation:fillin 1s cubic-bezier(.2,.8,.2,1) .2s both}
@keyframes fillin{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.sweep{animation:sweep 2.8s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-9px)}to{transform:translateY(9px)}}
@media (prefers-reduced-motion:reduce){.float,.fill-in,.sweep{animation:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; padding: 18px 16px; display: flex; flex-direction: column; gap: 14px; position: relative; overflow: hidden; background: #0b0f16; color: #e9eef6; font-family: 'Barlow', sans-serif">
  <div style="display: flex; flex-direction: column; gap: 6px">
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 15px; line-height: 1.2; letter-spacing: 2px; color: #d5dde8">TOTAL TASKS COMPLETED</div>
    <div role="progressbar" aria-label="Total tasks completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="{{ progress }}" style="height: 26px; box-sizing: border-box; background: #1c2b20; border: 3px solid #0b0e13; border-radius: 6px; overflow: hidden">
      <div class="fill-in" style="width: {{progressWidth}}; height: 100%; box-sizing: border-box; background: #43d15d; border-right: 3px solid #0b0e13">
        <div style="height: 4px; background: #58f07a"></div>
      </div>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 14px">
    <svg class="float" viewBox="0 0 100 124" aria-hidden="true" style="flex: none; width: 56px; height: 69px">
      <path d="M6 44 Q6 38 12 38 L24 38 L24 90 L12 90 Q6 90 6 84 Z" fill="{{player.c}}" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
      <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{player.c}}"></path>
      <path d="M24 74 Q32 100 55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{player.s}}"></path>
      <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="none" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
      <rect x="50" y="24" width="48" height="28" rx="14" fill="#95CADC" stroke="#0b0e13" stroke-width="6"></rect>
      <rect x="70" y="29" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.85"></rect>
    </svg>
    <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 6px">
      <h1 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: 1px; color: #e9eef6">{{ player.name }}</h1>
      <span style="display: inline-block; padding: 3px 12px 3px 14px; background: #0e2a33; border: 2px solid #8CFFFF; border-radius: 999px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; line-height: 1.2; letter-spacing: 2px; color: #8CFFFF">{{ player.role }}</span>
    </div>
  </div>
  <div style="background: #141a24; border: 3px solid #0b0e13; border-radius: 16px; padding: 14px 16px 3px">
    <div style="display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 10px">
      <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; letter-spacing: 2px; color: #e9eef6">YOUR TASKS</h2>
      <span style="font-family: 'VT323', monospace; font-size: 24px; line-height: 1; color: #8CFFFF">{{ taskCount }}</span>
    </div>
    <ul role="list" style="margin: 0; padding: 0; list-style: none">
      <sc-for list="{{ tasks }}" as="t" hint-placeholder-count="4">
        <li style="display: flex; align-items: flex-start; gap: 12px; padding: 11px 0; border-top: 2px solid #0b0e13">
          <div style="flex: none; width: 30px; height: 30px; margin-top: -3px">
            <sc-if value="{{ t.isDone }}" hint-placeholder-val="{{ true }}">
              <svg viewBox="0 0 32 32" role="img" aria-label="Done" style="display: block; width: 30px; height: 30px">
                <circle cx="16" cy="16" r="12.5" fill="#43d15d" stroke="#0b0e13" stroke-width="3"></circle>
                <path d="M10.5 16.5 L14.5 20.5 L21.5 12.5" fill="none" stroke="#07210e" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"></path>
              </svg>
            </sc-if>
            <sc-if value="{{ t.isDoing }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 32 32" role="img" aria-label="In progress" style="display: block; width: 30px; height: 30px">
                <circle cx="16" cy="16" r="12" fill="none" stroke="#ffd400" stroke-width="4"></circle>
                <path d="M16 9 A7 7 0 0 1 16 23 Z" fill="#ffd400"></path>
              </svg>
            </sc-if>
            <sc-if value="{{ t.isTodo }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 32 32" role="img" aria-label="To do" style="display: block; width: 30px; height: 30px">
                <circle cx="16" cy="16" r="12.5" fill="none" stroke="#6b7a90" stroke-width="3"></circle>
              </svg>
            </sc-if>
          </div>
          <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 5px">
            <div style="font-family: 'Barlow', sans-serif; font-weight: 700; font-size: 19px; line-height: 1.2; color: {{t.ink}}; text-wrap: balance"><span>{{ t.name }}</span> <sc-if value="{{ t.hasStep }}" hint-placeholder-val="{{ false }}"><span style="display: inline-block; vertical-align: middle; padding: 1px 7px 1px 8px; background: #2b2709; border: 2px solid #ffd400; border-radius: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; line-height: 1.15; letter-spacing: 1.5px; color: #ffd400; white-space: nowrap">{{ t.step }}</span></sc-if></div>
            <div style="align-self: flex-start; padding: 2px 7px; background: #10151f; border: 2px solid #0b0e13; border-radius: 6px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 13px; line-height: 1.2; letter-spacing: 2px; color: #c9d3e1">{{ t.room }}</div>
          </div>
        </li>
      </sc-for>
    </ul>
  </div>
  <div style="display: flex; align-items: center; gap: 14px; background: #141a24; border: 3px solid #0b0e13; border-radius: 16px; padding: 14px 16px">
    <svg viewBox="0 0 44 44" aria-hidden="true" style="flex: none; width: 44px; height: 44px">
      <path d="M3 14 V8 Q3 3 8 3 H14 M30 3 H36 Q41 3 41 8 V14 M41 30 V36 Q41 41 36 41 H30 M14 41 H8 Q3 41 3 36 V30" fill="none" stroke="#8CFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>
      <path d="M13 13 H19 V19 H13 Z M25 13 H31 V19 H25 Z M13 25 H19 V31 H13 Z" fill="none" stroke="#e9eef6" stroke-width="2"></path>
      <path d="M15 15 H17 V17 H15 Z M27 15 H29 V17 H27 Z M15 27 H17 V29 H15 Z M24 24 H27 V27 H24 Z M29 24 H32 V27 H29 Z M26 29 H29 V32 H26 Z" fill="#e9eef6"></path>
      <path class="sweep" d="M8 22 H36" fill="none" stroke="#8CFFFF" stroke-width="2.5" stroke-linecap="round"></path>
    </svg>
    <p style="margin: 0; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 17px; line-height: 1.3; color: #d5dde8; text-wrap: pretty">Scan the QR code at a task spot to start that task.</p>
  </div>
  <div style="display: flex; flex-direction: column; gap: 4px; background: #141a24; border: 3px solid #0b0e13; border-radius: 16px; padding: 14px 16px">
    <h2 style="margin: 0; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; line-height: 1.1; letter-spacing: 2px; color: #e9eef6">{{ badgeTitle }}</h2>
    <p style="margin: 0; font-family: 'Barlow', sans-serif; font-weight: 500; font-size: 16px; line-height: 1.35; color: #c9d3e1; text-wrap: pretty">Wear it on your back. Found a body? Scan its badge to report it.</p>
  </div>
  <div style="margin-top: auto; text-align: center; font-family: 'VT323', monospace; font-size: 20px; line-height: 1; color: #a9b4c3">{{ server }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const player = { name: 'PLAYER 3', role: 'CREWMATE', c: '#50F039', s: '#15A842', badge: '07' };
    const tasks = [
      { name: 'Swipe Card', room: 'ADMIN', state: 'done', step: '' },
      { name: 'Fix Wiring', room: 'ELECTRICAL', state: 'done', step: '' },
      { name: 'Download Data, then Upload Data', room: 'CAFETERIA, THEN ADMIN', state: 'doing', step: 'STEP 1 OF 2' },
      { name: 'Start Reactor', room: 'REACTOR', state: 'todo', step: '' }
    ].map((t) => ({
      name: t.name,
      room: t.room,
      step: t.step,
      hasStep: t.step !== '',
      isDone: t.state === 'done',
      isDoing: t.state === 'doing',
      isTodo: t.state === 'todo',
      ink: t.state === 'done' ? '#58f07a' : '#e9eef6'
    }));
    const done = tasks.filter((t) => t.isDone).length;
    const progress = 55;
    return {
      player: player,
      badgeTitle: 'BADGE ' + player.badge,
      tasks: tasks,
      taskCount: done + ' / ' + tasks.length,
      progress: progress,
      progressWidth: progress + '%',
      server: '192.168.11.220:8740'
    };
  }
}
</script>
</body>
</html>
