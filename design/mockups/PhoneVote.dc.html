<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Phone voting</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@500;700&amp;family=Luckiest+Guy&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0b0f16;font-family:'Barlow',sans-serif;color:#e9eef6}
.outlined{text-shadow:4px 0 0 #0b0e13,-4px 0 0 #0b0e13,0 4px 0 #0b0e13,0 -4px 0 #0b0e13,3px 3px 0 #0b0e13,-3px 3px 0 #0b0e13,3px -3px 0 #0b0e13,-3px -3px 0 #0b0e13,0 7px 0 #0b0e13}
.btn{cursor:pointer}
.btn:disabled{cursor:default}
.btn:focus-visible{outline:3px solid #ffffff;outline-offset:2px}
.vote-btn{background:transparent;transition:background-color .12s,transform .08s}
.vote-btn:not(:disabled):hover{background:#1a2130}
.vote-btn:not(:disabled):active{transform:scale(.98)}
.press{transition:transform .08s}
.press:not(:disabled):active{transform:translateY(2px)}
.skip:disabled{opacity:.45}
.pop-in{animation:popin .22s ease-out both}
@keyframes popin{from{transform:scale(.94);opacity:0}to{transform:scale(1);opacity:1}}
.drop-in{animation:dropin .18s ease-out both}
@keyframes dropin{from{transform:translateY(-6px);opacity:0}to{transform:translateY(0);opacity:1}}
.stamp{animation:stamp .3s cubic-bezier(.22,1,.36,1) both}
@keyframes stamp{from{transform:scale(1.7) rotate(-10deg);opacity:0}to{transform:scale(1) rotate(0deg);opacity:1}}
@media (prefers-reduced-motion: reduce){.pop-in,.drop-in,.stamp{animation:none}.vote-btn,.press{transition:none}}
</style>
</helmet>
<div style="width: 390px; height: 908px; position: relative; overflow: hidden; background: #05060d">
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; padding: 16px; display: flex; flex-direction: column; gap: 12px; background: #0b0f16; color: #e9eef6; font-family: 'Barlow', sans-serif; font-weight: 500">
  <header style="display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center">
    <h1 class="outlined" style="margin: 0; font-family: 'Luckiest Guy', sans-serif; font-weight: 400; font-size: 30px; line-height: 1.1; color: #ffffff; text-wrap: balance">WHO IS THE IMPOSTOR?</h1>
    <div style="display: flex; align-items: baseline; gap: 10px">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 16px; letter-spacing: 2px; color: #d5dde8">VOTING ENDS IN</span>
      <span role="timer" style="font-family: 'VT323', monospace; font-size: 30px; line-height: 1; color: #ffd400">{{ clock }}</span>
    </div>
    <p style="margin: 0; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 500; line-height: 1.3; color: #c9d3e1">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; flex: none">
        <path d="M8 16.5 L9.5 21 L12.2 21 L11.2 17.6 Z" fill="#c9d3e1"></path>
        <path d="M2.5 10 Q2.5 8.8 3.7 8.8 L6.5 8.8 L6.5 15.2 L3.7 15.2 Q2.5 15.2 2.5 14 Z" fill="#c9d3e1"></path>
        <path d="M6.5 8.8 L15 4.2 L15 19.8 L6.5 15.2 Z" fill="#ff3b30" stroke="#ff3b30" stroke-width="1.6" stroke-linejoin="round"></path>
        <path d="M18 9 Q20.5 12 18 15 M20.5 6.2 Q24 12 20.5 17.8" stroke="#ff3b30" stroke-width="2" stroke-linecap="round" fill="none"></path>
      </svg>
      <span>Body reported by PLAYER 3</span>
      <span aria-hidden="true" style="display: block; flex: none; width: 4px; height: 4px; border-radius: 2px; background: #c9d3e1"></span>
      <span>dead: PLAYER 4</span>
    </p>
  </header>
  <sc-if value="{{ hasVoted }}" hint-placeholder-val="{{ false }}">
    <div class="pop-in" style="display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; box-sizing: border-box; padding: 8px 14px; background: #0e2a33; border: 3px solid #0b0e13; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; letter-spacing: 2px; color: #8CFFFF">
      <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px; flex: none">
        <path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" stroke="#8CFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
      </svg>
      <span>{{ banner }}</span>
    </div>
  </sc-if>
  <div role="list" aria-label="Players" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; align-items: start">
    <sc-for list="{{ players }}" as="p" hint-placeholder-count="7">
      <div role="listitem" style="min-width: 0; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 8px; background: #141a24; border: 3px solid {{p.border}}; border-radius: 14px; opacity: {{p.op}}">
        <button type="button" class="btn vote-btn" onClick="{{ p.pick }}" disabled="{{ p.off }}" aria-label="Vote for {{p.name}}" aria-describedby="vote-note-{{p.n}}" style="width: 100%; min-height: 48px; box-sizing: border-box; margin: 0; padding: 0 4px; display: flex; align-items: center; gap: 10px; border: 0; border-radius: 8px; color: #e9eef6; font: inherit; text-align: left">
          <span style="position: relative; display: block; flex: none; width: 36px; height: 44px">
            <svg viewBox="0 0 100 124" aria-hidden="true" style="display: block; width: 36px; height: 44px; overflow: visible">
              <path d="M6 44 Q6 38 12 38 L24 38 L24 90 L12 90 Q6 90 6 84 Z" fill="{{p.c}}" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
              <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{p.c}}"></path>
              <path d="M24 74 Q32 100 55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{p.s}}"></path>
              <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="none" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
              <rect x="50" y="24" width="48" height="28" rx="14" fill="#95CADC" stroke="#0b0e13" stroke-width="6"></rect>
              <rect x="70" y="29" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.85"></rect>
            </svg>
            <sc-if value="{{ p.dead }}" hint-placeholder-val="{{ false }}">
              <svg viewBox="0 0 100 124" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 36px; height: 44px">
                <path d="M24 28 L88 106 M88 28 L24 106" stroke="#0b0e13" stroke-width="22" stroke-linecap="round" fill="none"></path>
                <path d="M24 28 L88 106 M88 28 L24 106" stroke="#ff3b30" stroke-width="12" stroke-linecap="round" fill="none"></path>
              </svg>
            </sc-if>
          </span>
          <span style="display: flex; flex-direction: column; align-items: flex-start; gap: 5px; min-width: 0">
            <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 20px; line-height: 1; letter-spacing: 1px; white-space: nowrap">{{ p.name }}</span>
            <span id="vote-note-{{p.n}}" style="display: flex; gap: 4px; min-height: 18px">
              <sc-if value="{{ p.you }}" hint-placeholder-val="{{ false }}">
                <span style="padding: 2px 5px; border-radius: 6px; background: #0e2a33; color: #8CFFFF; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 12px; line-height: 14px; letter-spacing: 0.5px; white-space: nowrap">YOU</span>
              </sc-if>
              <sc-if value="{{ p.votedTag }}" hint-placeholder-val="{{ true }}">
                <span class="stamp" style="padding: 2px 5px; border-radius: 6px; background: #ffd400; color: #1a1400; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 12px; line-height: 14px; letter-spacing: 0.5px; white-space: nowrap">I VOTED</span>
              </sc-if>
              <sc-if value="{{ p.dead }}" hint-placeholder-val="{{ false }}">
                <span style="padding: 0 3px; border: 2px solid #ff3b30; border-radius: 6px; background: #0b0e13; color: #ffffff; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 12px; line-height: 14px; letter-spacing: 0.5px; white-space: nowrap">DEAD</span>
              </sc-if>
            </span>
          </span>
        </button>
        <sc-if value="{{ p.isSel }}" hint-placeholder-val="{{ false }}">
          <div class="drop-in" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
            <button type="button" class="btn press" onClick="{{ p.confirm }}" aria-label="Confirm vote for {{p.name}}" style="min-height: 44px; box-sizing: border-box; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #43d15d; border: 3px solid #0b0e13; border-radius: 10px">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 26px; height: 26px">
                <path d="M4.5 12.5 L9.5 17.5 L19.5 6.5" stroke="#07210e" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"></path>
              </svg>
            </button>
            <button type="button" class="btn press" onClick="{{ p.cancel }}" aria-label="Cancel vote" style="min-height: 44px; box-sizing: border-box; margin: 0; padding: 0; display: flex; align-items: center; justify-content: center; background: #2b3445; border: 3px solid #0b0e13; border-radius: 10px">
              <svg viewBox="0 0 24 24" aria-hidden="true" style="width: 22px; height: 22px">
                <path d="M6 6 L18 18 M18 6 L6 18" stroke="#e9eef6" stroke-width="4" stroke-linecap="round" fill="none"></path>
              </svg>
            </button>
          </div>
        </sc-if>
      </div>
    </sc-for>
  </div>
  <p aria-live="polite" style="margin: 0; text-align: center; font-size: 15px; font-weight: 500; line-height: 1.3; color: #a9b4c3; text-wrap: balance">{{ hint }}</p>
  <button type="button" class="btn press skip" onClick="{{ skip }}" disabled="{{ locked }}" style="margin-top: auto; width: 100%; height: 52px; box-sizing: border-box; padding: 0 16px; background: #2b3445; color: #e9eef6; border: 3px solid #0b0e13; border-radius: 12px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 2px">SKIP VOTE</button>
</div>
<div style="position: absolute; left: 0; top: 844px; width: 390px; height: 64px; box-sizing: border-box; padding: 0 16px; display: flex; align-items: center; gap: 10px; background: #10151f; border-top: 3px solid #0b0e13; font-family: 'Barlow Condensed', sans-serif">
  <span style="font-weight: 800; font-size: 17px; letter-spacing: 2px; color: #a9b4c3; margin-right: 6px">PREVIEW CONTROLS</span>
  <button type="button" onClick="{{ reset }}" style="height: 44px; padding: 0 14px; border: 3px solid #0b0e13; border-radius: 10px; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 1px; text-transform: uppercase; background: #2b3445; color: #e9eef6; cursor: pointer">Reset</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":908}}'>
class Component extends DCLogic {
  cur() {
    return Object.assign({ sel: null, voted: null, left: 45 }, this.state || {});
  }
  componentDidMount() {
    this.tick = setInterval(() => {
      const left = this.cur().left;
      this.setState({ left: left > 0 ? left - 1 : 45 });
    }, 1000);
  }
  componentWillUnmount() {
    clearInterval(this.tick);
  }
  renderVals() {
    const st = this.cur();
    const hasVoted = st.voted !== null;
    const roster = [
      { n: 1, c: '#C61111', sh: '#7A0838', early: true },
      { n: 2, c: '#132ED2', sh: '#09158E' },
      { n: 3, c: '#50F039', sh: '#15A842', you: true },
      { n: 4, c: '#EE54BB', sh: '#AC2BAE', dead: true },
      { n: 5, c: '#F07D0D', sh: '#B43E15' },
      { n: 6, c: '#F6F657', sh: '#C38822', early: true },
      { n: 7, c: '#38FFDD', sh: '#24A9BF', early: true }
    ];
    const players = roster.map((r, i) => {
      const dead = r.dead === true;
      const you = r.you === true;
      const isSel = !hasVoted && st.sel === i;
      return {
        n: r.n,
        name: 'PLAYER ' + r.n,
        c: r.c,
        s: r.sh,
        dead: dead,
        you: you,
        votedTag: r.early === true || (you && hasVoted),
        isSel: isSel,
        off: dead || hasVoted,
        border: isSel || st.voted === i ? '#8CFFFF' : '#0b0e13',
        op: dead ? 0.45 : 1,
        pick: () => {
          if (!dead && this.cur().voted === null) this.setState({ sel: i });
        },
        confirm: () => {
          if (this.cur().voted === null) this.setState({ voted: i, sel: null });
        },
        cancel: () => this.setState({ sel: null })
      };
    });
    const chosen = typeof st.voted === 'number' ? roster[st.voted] : null;
    let banner = '';
    if (st.voted === 'skip') banner = 'YOU SKIPPED';
    else if (chosen) banner = 'YOU VOTED FOR PLAYER ' + chosen.n;
    const mm = Math.floor(st.left / 60);
    const ss = st.left % 60;
    return {
      clock: mm + ':' + (ss < 10 ? '0' : '') + ss,
      hasVoted: hasVoted,
      banner: banner,
      players: players,
      hint: hasVoted ? 'Vote locked in. Waiting for the others.' : 'Tap a player, then confirm. Votes are final.',
      locked: hasVoted,
      skip: () => {
        if (this.cur().voted === null) this.setState({ voted: 'skip', sel: null });
      },
      reset: () => this.setState({ sel: null, voted: null })
    };
  }
}
</script>
</body>
</html>
