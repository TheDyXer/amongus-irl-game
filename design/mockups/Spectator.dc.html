<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>TV lobby</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@500;700&amp;family=Luckiest+Guy&amp;family=VT323&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#05060d;font-family:'Barlow',sans-serif;color:#e9eef6}
.drift{animation-name:drift;animation-timing-function:linear;animation-iteration-count:infinite}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-1280px)}}
.float{animation:float 3.2s ease-in-out infinite alternate}
@keyframes float{from{transform:translateY(0)}to{transform:translateY(-6px)}}
@media (prefers-reduced-motion: reduce){.drift,.float{animation:none}}
.outlined{text-shadow:4px 0 0 #0b0e13,-4px 0 0 #0b0e13,0 4px 0 #0b0e13,0 -4px 0 #0b0e13,3px 3px 0 #0b0e13,-3px 3px 0 #0b0e13,3px -3px 0 #0b0e13,-3px -3px 0 #0b0e13,0 7px 0 #0b0e13}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #05060d; color: #e9eef6; font-family: 'Barlow', sans-serif">
  <sc-for list="{{ layers }}" as="L" hint-placeholder-count="3">
    <div class="drift" style="position: absolute; left: 0; top: 0; width: 2560px; height: 720px; animation-duration: {{L.dur}}">
      <sc-for list="{{ L.stars }}" as="st" hint-placeholder-count="20">
        <div style="position: absolute; left: {{st.x}}px; top: {{st.y}}px; width: {{st.s}}px; height: {{st.s}}px; background: #ffffff; opacity: {{st.o}}"></div>
      </sc-for>
    </div>
  </sc-for>
  <div style="position: absolute; left: 64px; top: 44px; width: 572px; display: flex; flex-direction: column; gap: 14px">
    <div class="outlined" style="font-family: 'Luckiest Guy', sans-serif; font-size: 88px; line-height: 1; letter-spacing: 3px; color: #ffffff">LOBBY</div>
    <div style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 1.5px; color: #8CFFFF">SCAN TO JOIN THE CREW</div>
    <div style="width: 340px; height: 340px; box-sizing: border-box; padding: 16px; background: #ffffff; border: 8px solid #0b0e13; border-radius: 18px">
      <svg viewBox="-1 -1 31 31" shape-rendering="crispEdges" role="img" aria-label="QR code to join the game" style="width: 100%; height: 100%; display: block">
        <path d="{{ qr }}" fill="#0b0e13"></path>
      </svg>
    </div>
    <div style="font-family: 'VT323', monospace; font-size: 36px; line-height: 1; color: #e9eef6">192.168.11.220:8740/join</div>
    <div style="font-size: 20px; font-weight: 500; white-space: nowrap; color: #a9b4c3">Join the house Wi-Fi, then scan with your phone camera.</div>
  </div>
  <div style="position: absolute; left: 656px; top: 60px; width: 560px; height: 540px; box-sizing: border-box; padding: 16px; background: #141a24; border: 6px solid #0b0e13; border-radius: 18px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 3px">CREW</span>
      <span style="font-family: 'VT323', monospace; font-size: 38px; color: #8CFFFF">7 / 15</span>
    </div>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px">
      <sc-for list="{{ players }}" as="p" hint-placeholder-count="7">
        <div style="display: flex; align-items: center; gap: 12px; padding: 8px 12px; background: #1a2130; border: 3px solid #0b0e13; border-radius: 14px">
          <svg class="float" aria-hidden="true" viewBox="0 0 100 124" style="width: 44px; height: 54px; animation-delay: {{p.delay}}">
            <path d="M6 44 Q6 38 12 38 L24 38 L24 90 L12 90 Q6 90 6 84 Z" fill="{{p.c}}" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
            <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{p.c}}"></path>
            <path d="M24 74 Q32 100 55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="{{p.s}}"></path>
            <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="none" stroke="#0b0e13" stroke-width="6" stroke-linejoin="round"></path>
            <rect x="50" y="24" width="48" height="28" rx="14" fill="#95CADC" stroke="#0b0e13" stroke-width="6"></rect>
            <rect x="70" y="29" width="18" height="7" rx="3.5" fill="#ffffff" opacity="0.85"></rect>
          </svg>
          <span style="font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 25px; letter-spacing: 1px">{{ p.name }}</span>
        </div>
      </sc-for>
    </div>
    <div style="margin-top: auto; font-size: 19px; font-weight: 500; color: #a9b4c3">8 spots left. Names and colours are picked on the phone.</div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: center; gap: 14px; font-family: 'Barlow Condensed', sans-serif; font-weight: 600; font-size: 30px; color: #d5dde8">
    <span>Waiting for the game master to start</span>
    <span aria-hidden="true" style="width: 6px; height: 6px; border-radius: 3px; background: #d5dde8"></span>
    <span>2 impostors this round</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  rng(seed) {
    let x = seed;
    return () => {
      x = (x * 16807) % 2147483647;
      return (x - 1) / 2147483646;
    };
  }
  qrPath(seed) {
    const n = 29;
    const r = this.rng(seed);
    const cells = [];
    const finder = (r0, c0) => {
      for (let i = 0; i < 7; i++) {
        for (let j = 0; j < 7; j++) {
          const edge = i === 0 || i === 6 || j === 0 || j === 6;
          const core = i >= 2 && i <= 4 && j >= 2 && j <= 4;
          if (edge || core) cells.push([r0 + i, c0 + j]);
        }
      }
    };
    finder(0, 0);
    finder(0, n - 7);
    finder(n - 7, 0);
    const reserved = (i, j) => (i < 8 && j < 8) || (i < 8 && j >= n - 8) || (i >= n - 8 && j < 8);
    for (let i = 0; i < n; i++) {
      for (let j = 0; j < n; j++) {
        if (reserved(i, j)) continue;
        if (i === 6 || j === 6) {
          if ((i + j) % 2 === 0) cells.push([i, j]);
          continue;
        }
        if (r() < 0.48) cells.push([i, j]);
      }
    }
    return cells.map((c) => 'M' + c[1] + ' ' + c[0] + 'h1v1h-1z').join('');
  }
  renderVals() {
    const r = this.rng(42);
    const layer = (count, size, lo, hi, dur) => {
      const stars = [];
      for (let i = 0; i < count; i++) {
        const x = Math.floor(r() * 1280);
        const y = Math.floor(r() * 720);
        const o = (lo + r() * (hi - lo)).toFixed(2);
        stars.push({ x: x, y: y, s: size, o: o });
        stars.push({ x: x + 1280, y: y, s: size, o: o });
      }
      return { dur: dur, stars: stars };
    };
    return {
      layers: [layer(70, 2, 0.3, 0.65, '170s'), layer(32, 3, 0.45, 0.8, '105s'), layer(12, 4, 0.7, 1, '62s')],
      qr: this.qrPath(7),
      players: [
        { name: 'PLAYER 1', c: '#C61111', s: '#7A0838', delay: '0s' },
        { name: 'PLAYER 2', c: '#132ED2', s: '#09158E', delay: '-0.8s' },
        { name: 'PLAYER 3', c: '#50F039', s: '#15A842', delay: '-1.6s' },
        { name: 'PLAYER 4', c: '#EE54BB', s: '#AC2BAE', delay: '-2.4s' },
        { name: 'PLAYER 5', c: '#F07D0D', s: '#B43E15', delay: '-0.4s' },
        { name: 'PLAYER 6', c: '#F6F657', s: '#C38822', delay: '-1.2s' },
        { name: 'PLAYER 7', c: '#38FFDD', s: '#24A9BF', delay: '-2s' }
      ]
    };
  }
}
</script>
</body>
</html>
