<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full-screen splashes</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;800&amp;family=Barlow:wght@500;700&amp;family=Luckiest+Guy&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#000;font-family:'Barlow',sans-serif;color:#e9eef6}
.outlined{text-shadow:4px 0 0 #0b0e13,-4px 0 0 #0b0e13,0 4px 0 #0b0e13,0 -4px 0 #0b0e13,3px 3px 0 #0b0e13,-3px 3px 0 #0b0e13,3px -3px 0 #0b0e13,-3px -3px 0 #0b0e13,0 7px 0 #0b0e13}
.band{transform-origin:50% 50%;animation:band .4s cubic-bezier(.2,1.5,.4,1) both}
@keyframes band{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.pop{animation:pop .5s ease-out .15s both}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08);opacity:1}100%{transform:scale(1);opacity:1}}
.spin{transform-origin:50% 50%;animation:spin 30s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tumble{animation:tumble 8s linear infinite}
@keyframes tumble{from{transform:translateX(-220px) rotate(0deg)}to{transform:translateX(1500px) rotate(600deg)}}
.type{display:inline-block;white-space:nowrap;clip-path:inset(0 100% 0 0);animation:type 2.4s steps(25) .5s forwards}
@keyframes type{to{clip-path:inset(0 0 0 0)}}
.late{opacity:0;animation:fadein .6s ease-out 3.2s forwards}
@keyframes fadein{to{opacity:1}}
.rise{animation:rise 3s ease-out both}
@keyframes rise{from{transform:translateY(-30px);opacity:0}to{transform:translateY(0);opacity:1}}
</style>
</helmet>

          <path d="M24 72 L34 64 L44 74 L55 64 L66 74 L78 64 L92 72 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="#EE54BB"></path>

    <sc-if value="{{ isEject }}" hint-placeholder-val="{{ false }}">

            <path d="M24 112 L24 50 C24 22 42 8 58 8 C76 8 92 22 92 48 L92 112 Q92 118 86 118 L67 118 Q61 118 61 112 L61 100 L55 100 L55 112 Q55 118 49 118 L30 118 Q24 118 24 112 Z" fill="#F07D0D"></path>

        </div>
        <div style="position: absolute; left: 0; right: 0; top: 214px; text-align: center; font-family: 'Barlow Condensed', sans-serif; font-weight: 800; font-size: 34px; letter-spacing: 3px; color: #d5dde8">{{ win.sub }}</div>
        <sc-for list="{{ win.crew }}" as="m" hint-placeholder-count="5">

    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":784}}'>
class Component extends DCLogic {
  rng(seed) {
    let x = seed;
    return () => {
      x = (x * 16807) % 2147483647;
      return (x - 1) / 2147483646;
    };
  }
  renderVals() {
    const s = Object.assign({ tab: 'emergency' }, this.state || {});
    const tab = s.tab;
    let rays = '';
    for (let k = 0; k < 14; k++) {
      const a = (k * 360) / 14;
      const p1 = ((a - 7) * Math.PI) / 180;
      const p2 = ((a + 7) * Math.PI) / 180;
      rays += 'M0 0 L' + (Math.cos(p1) * 160).toFixed(1) + ' ' + (Math.sin(p1) * 160).toFixed(1) + ' L' + (Math.cos(p2) * 160).toFixed(1) + ' ' + (Math.sin(p2) * 160).toFixed(1) + ' Z ';
    }
    let jag = 'M0 30';
    for (let x = 0; x < 1280; x += 40) jag += ' L' + (x + 20) + ' 4 L' + (x + 40) + ' 30';
    jag += ' L1280 330';
    for (let x = 1280; x > 0; x -= 40) jag += ' L' + (x - 20) + ' 356 L' + (x - 40) + ' 330';
    jag += ' Z';
    const r = this.rng(11);
    const stars = [];
    for (let i = 0; i < 110; i++) {
      stars.push({ x: Math.floor(r() * 1280), y: Math.floor(r() * 720), s: r() < 0.2 ? 3 : 2, o: (0.35 + r() * 0.6).toFixed(2) });
    }
    const crewWin = {
      title: 'CREWMATES WIN',
      color: '#8CFFFF',
      floor: '#111f1f',
      sub: 'ALL TASKS COMPLETED',
      crew: [
        { x: 220, y: 330, w: 120, h: 149, c: '#38FFDD', s: '#24A9BF', o: 1 },
        { x: 940, y: 330, w: 120, h: 149, c: '#F6F657', s: '#C38822', o: 1 },
        { x: 370, y: 360, w: 150, h: 186, c: '#50F039', s: '#15A842', o: 1 },
        { x: 760, y: 360, w: 150, h: 186, c: '#EE54BB', s: '#AC2BAE', o: 0.6 },
        { x: 545, y: 390, w: 190, h: 236, c: '#C61111', s: '#7A0838', o: 1 }
      ]
    };
    const impWin = {
      title: 'IMPOSTORS WIN',
      color: '#FF1919',
      floor: '#1f0506',
      sub: 'THE IMPOSTORS MATCHED THE LIVING CREW',
      crew: [
        { x: 430, y: 360, w: 190, h: 236, c: '#132ED2', s: '#09158E', o: 1 },
        { x: 660, y: 360, w: 190, h: 236, c: '#F07D0D', s: '#B43E15', o: 1 }
      ]
    };
    const defs = [
      { id: 'shh', label: 'Shhhhh' },
      { id: 'emergency', label: 'Emergency meeting' },
      { id: 'body', label: 'Dead body reported' },
      { id: 'eject', label: 'Ejection' },
      { id: 'crew', label: 'Crewmates win' },
      { id: 'imp', label: 'Impostors win' }
    ];
    const tabs = defs.map((d) => ({
      label: d.label,
      bg: d.id === tab ? '#8CFFFF' : '#2b3445',
      fg: d.id === tab ? '#07131a' : '#e9eef6',
      pressed: d.id === tab ? 'true' : 'false',
      pick: () => this.setState({ tab: d.id })
    }));
    return {
      isShh: tab === 'shh',
      isEmergency: tab === 'emergency',
      isBody: tab === 'body',
      isEject: tab === 'eject',
      isWin: tab === 'crew' || tab === 'imp',
      win: tab === 'imp' ? impWin : crewWin,
      rays: rays,
      jag: jag,
      stars: stars,
      tabs: tabs
    };
  }
}
</script>
